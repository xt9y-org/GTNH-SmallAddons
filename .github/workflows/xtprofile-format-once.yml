name: XTProfile format once

on:
  push:
    branches:
      - xtprofile

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[spotless]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: xtprofile
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
      - name: Apply Spotless
        run: |
          chmod +x gradlew
          ./gradlew spotlessApply
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main/java src/mixin/java
          git commit -m 'chore: apply spotless [spotless]'
          git push origin HEAD:xtprofile
