name: Build and test

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

jobs:
  build-and-test:
    uses: GTNewHorizons/GTNH-Actions-Workflows/.github/workflows/build-and-test.yml@master
    secrets: inherit

  xtprofile-spotless-output:
    if: github.head_ref == 'xtprofile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
      - run: ./gradlew spotlessApply
      - uses: actions/upload-artifact@v7
        with:
          name: xtprofile-spotless-output
          path: |
            src/main/java/com/xt9y/features/XT9YFeatures.java
            src/main/java/com/xt9y/features/xtprofile/
