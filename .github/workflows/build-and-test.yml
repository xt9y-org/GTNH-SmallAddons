name: Build and test

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

jobs:
  build-and-test:
    uses: GTNewHorizons/GTNH-Actions-Workflows/.github/workflows/build-and-test.yml@master
    secrets: inherit

  validate-mixin-method-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prevent invalid @Implements redirect names
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path("src/mixin/java/com/xt9y/features/mixin/mixins/late/MixinDualityInterface.java").read_text()
          prefixed_methods = set(re.findall(r"\b(?:public|private|protected)\s+\w+\s+(xt9y\$\w+)\s*\(", source))
          allowed = {"xt9y$isWildcardEnabled", "xt9y$setWildcardEnabled"}
          assert prefixed_methods == allowed, f"Unexpected @Implements prefix on method: {prefixed_methods ^ allowed}"
          PY

  validate-ae2-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure removed AE2 GuiColors API is not used
        run: |
          if grep -R -n 'GuiColors' src/main/java src/mixin/java; then
            echo 'Outdated AE2 GuiColors reference detected'
            exit 1
          fi
          grep -q 'Applied-Energistics-2-Unofficial:rv3-beta-1080-GTNH:dev' build.gradle.kts

  validate-tooltip-layering:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify stable tooltip render hook and panel fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('src/main/java/com/xt9y/features/xtprofile/XTProfileClientOverlay.java').read_text()
          mixin = Path('src/mixin/java/com/xt9y/features/mixin/mixins/late/MixinAEGuiTooltipXTProfile.java').read_text()
          config = Path('src/main/resources/mixins.xt9yfeatures.json').read_text()
          assert 'AEBaseGui$AEGuiTooltip' in mixin
          assert '@Inject(method = "draw", at = @At("HEAD")' in mixin
          assert 'MixinAEGuiTooltipXTProfile' in config
          assert 'MixinAEBaseGuiXTProfile' not in config
          assert 'public static void renderBeforeTooltip' in source
          assert 'GuiScreenEvent.DrawScreenEvent.Post' in source
          assert 'if (!renderedBeforeTooltip) drawPanel' in source
          assert 'GL11.glDisable(GL11.GL_SCISSOR_TEST)' in source
          PY

  publish-tooltip-layering-fix:
    needs: [build-and-test, validate-mixin-method-names, validate-ae2-compatibility, validate-tooltip-layering]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      startsWith(github.event.head_commit.message, 'release: XTProfile tooltip layering v1.2.7')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create v1.2.7 tag from tested commit
        run: |
          git tag v1.2.7 "$GITHUB_SHA"
          git push origin v1.2.7
      - name: Dispatch tagged JAR release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/release-tags.yml/dispatches" -f ref="v1.2.7"
