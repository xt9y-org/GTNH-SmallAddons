name: Publish v1.1.0 trigger

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/publish-v1.1.0-trigger.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish v1.1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release view v1.1.0 >/dev/null 2>&1 || gh release create v1.1.0 --repo "${GITHUB_REPOSITORY}" --target da9c5d2a1b0a5c3720f2d13e838468eb2a62433b --generate-notes
