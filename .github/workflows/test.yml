name: TEST
on:
  push:
    branches: [little-tiles]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test GTNH 1.7.10 client mod
        run: ./gradlew --no-daemon --stacktrace test build
